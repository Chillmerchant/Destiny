    <script>
        let storedLink = '';

        function resizeAllGridItems() {
            const gallery = document.querySelector('.gallery');
            const rowHeight = parseInt(window.getComputedStyle(gallery).getPropertyValue('grid-auto-rows'));
            const rowGap = parseInt(window.getComputedStyle(gallery).getPropertyValue('gap'));

            document.querySelectorAll('.gallery-item').forEach(item => {
                const content = item.querySelector('a');
                const rowSpan = Math.ceil((content.getBoundingClientRect().height + rowGap) / (rowHeight + rowGap));
                item.style.setProperty('--row-span', rowSpan);
            });
        }

        window.addEventListener('load', resizeAllGridItems);
        window.addEventListener('resize', resizeAllGridItems);

        document.querySelectorAll('.gallery-item img').forEach(img => {
            img.addEventListener('load', resizeAllGridItems);
        });

        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const captionText = document.getElementById('caption');
        const closeBtn = document.querySelector('.close');

        document.querySelectorAll('.gallery-item a').forEach(link => {
            link.addEventListener('click', function(event) {
                event.preventDefault();
                storedLink = this.getAttribute('href');
                lightbox.style.display = 'block';
                lightboxImg.src = this.querySelector('img').src;
                captionText.innerHTML = this.querySelector('figcaption').innerText;
            });
        });

        lightboxImg.addEventListener('click', function() {
            window.location.href = storedLink;
        });

        closeBtn.addEventListener('click', function() {
            lightbox.style.display = 'none';
        });

        lightbox.addEventListener('click', function(event) {
            if (event.target === lightbox) {
                lightbox.style.display = 'none';
            }
        });

        const filterButtons = document.querySelectorAll('.filter-buttons button');
        const items = document.querySelectorAll('.gallery-item');

        function showFilteredItems(filterValue) {
            items.forEach(item => {
                if (filterValue === 'all' || item.getAttribute('data-category') === filterValue) {
                    item.style.display = 'block';
                } else {
                    item.style.display = 'none';
                }
            });
            resizeAllGridItems();
        }

        filterButtons.forEach(button => {
            button.addEventListener('click', () => {
                filterButtons.forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');
                const filterValue = button.getAttribute('data-filter');
                showFilteredItems(filterValue);
            });
        });

        showFilteredItems('all');
    </script>
